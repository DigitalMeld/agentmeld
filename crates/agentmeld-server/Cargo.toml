[package]
name = "agentmeld-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agentmeld-server"
path = "src/main.rs"

[lib]
name = "agentmeld_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
libc = "0.2.189"
http-body-util = "0.1"
